name: Build

on:
  push:
    branches:
    - master

    tags:
    - '*'

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64,arm64]
    env:
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v5
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26.9
    - name: build
      run: make
    - name: test
      # @fixme: return test for non-amd64 arch when github will add support for other architectures (arm64)
      if: ${{ matrix.arch == 'amd64' }}
      run: make test
    - name: prepare artifact
      if: startsWith(github.ref, 'refs/tags/')
      run: make package
    - name: upload artifact
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v7
      with:
        name: gotpl-${{ matrix.arch }}
        path: gotpl-linux-${{ matrix.arch }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: download artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: gotpl-*
        merge-multiple: true
    - name: verify artifacts
      run: |
        test -f gotpl-linux-amd64.tar.gz
        test -f gotpl-linux-arm64.tar.gz
    - name: create release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          gotpl-linux-amd64.tar.gz \
          gotpl-linux-arm64.tar.gz \
          --title "$GITHUB_REF_NAME" \
          --notes "" \
          --verify-tag
